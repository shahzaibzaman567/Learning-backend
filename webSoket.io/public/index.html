<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wide Responsive Chat</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Width ko barha kar max-width increase kar di hai */
        .chat-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            overflow: hidden;
            width: 132%; 
            max-height: 90vh;
        }

        .chat-header {
            background: var(--primary-gradient);
            padding: 15px;
            color: white;
            text-align: center;
        }

        #chat-box {
            height: 60vh;
            min-height: 300px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .msg-item {
            background: white;
            padding: 10px 15px;
            border-radius: 15px;
            border-bottom-left-radius: 2px;
            margin-bottom: 12px;
            width: fit-content;
            max-width: 85%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }

        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<!-- Container width increased to col-lg-10 -->
<div class="container d-flex justify-content-center px-3">
    <div class="col-12 col-md-10 col-lg-10 col-xl-9">
        
        <div class="card chat-card">
            <div class="chat-header">
                <h5 class="mb-0">✨ Wide Chat Lounge</h5>
            </div>
            
            <div id="chat-box">
                <div id="display-messages"></div>
            </div>

            <div class="input-area">
                <div class="input-group">
                    <input type="text" id="message" class="form-control shadow-none border-secondary-subtle p-5" placeholder="Write a message...">
                    <button class="btn btn-primary px-5 fw-bold" id="send" style="background: var(--primary-gradient); border: none;">
                        Send
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const sendBtn = document.getElementById("send");
    const messageInput = document.getElementById("message");
    const displayArea = document.getElementById("display-messages");
    const chatBox = document.getElementById("chat-box");

    socket.on("message", (msg) => {
        const div = document.createElement("div");
        div.className = "msg-item";
        div.innerText = msg;
        displayArea.appendChild(div);
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    });

    sendBtn.addEventListener("click", () => {
        const text = messageInput.value.trim();
        if(text !== "") {
            socket.emit("User-message", text);
            messageInput.value = "";
        }
    });

    messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendBtn.click();
    });
</script>

</body>
</html>
